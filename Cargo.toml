[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-Wonderland"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release packages (`tools/package-release.sh`).
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
