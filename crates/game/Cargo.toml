[package]
name = "wonderland-game"
description = "The Wonderland Classic games on Bevy"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wonderland"
path = "src/main.rs"

[dependencies]
# Only what the games use: 3D meshes, a window, the keyboard, the mouse (the
# editor), controllers, UI text for the HUD and WAV sound. Building `bevy_audio` on Linux needs the ALSA
# headers (`libasound2-dev`). Textures
# (BMP/JPEG) are decoded with `image` here, so Bevy's image formats stay
# off. The camera turns tonemapping off, so its lookup tables are not
# needed either.
bevy = { version = "=0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_winit",
    "x11",
    "wayland",
    "keyboard",
    "mouse",
    "gamepad",
    "bevy_gilrs",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_color",
    "bevy_mesh",
    "bevy_image",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "bevy_audio",
    "wav",
] }
# The editor's panels.
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
# PNG only for `WL_SCREENSHOT`.
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
# Impulse Tracker music (`res3.dat` to `res8.dat`), mixed in Rust.
xmrs = "0.15"
xmrsplayer = "0.15"
wonderland-formats = { path = "../formats" }
wonderland-logic = { path = "../logic" }
wonderland-campaign = { path = "../campaign" }
wonderland-editor = { path = "../editor" }

# wgpu's OpenGL backend, the last fallback on Linux (on Windows it would
# need ANGLE, so Vulkan is the fallback there).
[target.'cfg(target_os = "linux")'.dependencies]
bevy_render = { version = "=0.20.0", default-features = false, features = ["gles"] }

[lints]
workspace = true
